    <text x="140" y="178" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="2">ISACS</text>
  </g>
  <text x="100" y="580" fill="#E6EEF8" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="600">Secure. Smart. Creative.</text>
  <circle cx="640" cy="360" r="90" fill="rgba(255,255,255,0.10)"/>
  <circle cx="640" cy="360" r="74" fill="url(#glow)" opacity="0.9"/>
  <path d="M618 323 L686 361 L618 399 Z" fill="#FFFFFF"/>
